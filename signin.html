<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Dipak. Study Center</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border: 3px solid #1565c0;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #1565c0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #1565c0;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>🔐 Sign In</h1>

  <p>Dipak. Study Center</p>

  <input type="email" id="email" placeholder="अपना Email लिखें">

  <input type="password" id="password" placeholder="अपना Password लिखें">

  <button id="loginBtn">Sign In</button>

  <button id="signupBtn">Create Account</button>

  <p id="message"></p>

  <a href="index.html" class="back">← वापस Home पर जाएँ</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyBwNXefQ7WfxnNzZ9pkTZh9PdBxOaHp3s0",
  authDomain: "dipak-study-center.firebaseapp.com",
  projectId: "dipak-study-center",
  storageBucket: "dipak-study-center.firebasestorage.app",
  messagingSenderId: "183656924132",
  appId: "1:183656924132:web:caf32aa575b292801e3df1"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const email = document.getElementById("email");

const password = document.getElementById("password");

const message = document.getElementById("message");


document.getElementById("signupBtn").addEventListener("click", async function() {

  if (!email.value || !password.value) {
    message.innerText = "कृपया Email और Password भरें।";
    return;
  }

  try {

    await createUserWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );

    message.innerText = "✅ Account सफलतापूर्वक बन गया!";

  } catch (error) {

    message.innerText = "❌ " + error.message;

  }

});


document.getElementById("loginBtn").addEventListener("click", async function() {

  if (!email.value || !password.value) {
    message.innerText = "कृपया Email और Password भरें।";
    return;
  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email.value,
      password.value
    );

    message.innerText = "✅ Sign In सफल हुआ!";

    setTimeout(function() {
      window.location.href = "index.html";
    }, 1000);

  } catch (error) {

    message.innerText = "❌ " + error.message;

  }

});

</script>

</body>
</html>
